		<meta charset="utf-8">

		<script type="module" src="./flv-to-mp4.ts"></script>
		<link rel="stylesheet" href="../base.css">
		<link rel="icon" href="../../docs/public/mediabunny-logo.svg">
		<link rel="canonical" href="https://mediabunny.dev/examples/flv-to-mp4/">

		<meta property="og:type" content="website">

		<meta property="og:description" content="Select or drop an FLV file, inspect its tracks, and convert it to an MP4 file entirely in the browser.">
		<meta property="og:url" content="https://mediabunny.dev/examples/flv-to-mp4/">
		<meta property="og:image" content="https://mediabunny.dev/mediabunny-og-image.png">

		<meta name="twitter:site" content="@vanilagy">

		<script type="application/ld+json">{"@context":"https://schema.org","@type":"BreadcrumbList","itemListElement":[{"@type":"ListItem","position":1,"name":"Examples","item":"https://mediabunny.dev/examples"},{"@type":"ListItem","position":2,"name":"FLV to MP4"}]}</script>
	</head>

	<body class="flex flex-col items-center py-10 bg-zinc-50 text-zinc-800 dark:bg-zinc-900 dark:text-zinc-200 px-2">
		<h1 class="text-3xl font-bold text-teal-500 text-center">FLV to MP4 example</h1>
		<p class="max-w-lg text-center">Select or drop a Flash Video (.flv) file to inspect its tracks, then convert it to an MP4 file without ever uploading it.</p>

		<div class="flex flex-col items-center gap-1">
			<div class="flex gap-2 mt-4">
				<button id="select-file" class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-5 py-2">
					Select local FLV file
				</button>

				<button id="load-url" class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-5 py-2">
					Load remote URL
				</button>
			</div>
		</div>

		<p class="text-xs opacity-60 mt-2 mx-auto text-center max-w-[36rem]" id="file-name"></p>

		<hr class="w-full max-w-96 my-4 border-zinc-300 dark:border-zinc-700" style="display: none;">

		<p id="error-element" class="text-red-500 mx-auto text-center max-w-[36rem]"></p>

		<div id="track-info" class="w-full max-w-xl flex flex-col gap-3" style="display: none;"></div>

		<div class="w-full max-w-80 h-2 rounded-full bg-zinc-200 dark:bg-zinc-750 overflow-hidden mt-6" id="progress-bar-container" style="display: none;">
			<div class="h-full bg-emerald-500 w-0" id="progress-bar"></div>
		</div>
		<p class="text-xs font-medium mt-1" id="speedometer" style="display: none;"></p>

		<div class="flex gap-2 mt-4">
			<button id="convert-button" class="rounded-lg bg-teal-500 hover:bg-teal-600 text-white px-5 py-2 disabled:opacity-50" style="display: none;">
				Convert to MP4
			</button>
			<button id="cancel-button" class="rounded-lg bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 px-5 py-2" style="display: none;">
				Cancel
			</button>
		</div>

		<video controls class="rounded-md mt-4 max-w-xl" style="display: none;"></video>

		<a id="download-link" download class="rounded-lg bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 mt-4" style="display: none;">
			Download MP4
		</a>
		<p class="text-xs font-medium mt-2" id="result-facts" style="display: none;"></p>

		<a href="/" class="fixed top-0 left-0 flex gap-2 py-2 px-5 items-center">
			<img src="../../docs/public/mediabunny-logo.svg" class="size-6">
			<p class="text-sm font-medium">Mediabunny</p>
		</a>

		<a
			href="https://github.com/Vanilagy/mediabunny/tree/main/examples/flv-to-mp4"
			target="_blank"
			class="flex items-center gap-2 fixed top-0 right-0 py-2 px-5 bg-zinc-200 dark:bg-zinc-750 hover:bg-zinc-300 dark:hover:bg-zinc-700 rounded-bl-xl"
		>
			<img src="../../docs/assets/github-mark.svg" class="size-6 dark:invert">
			<p>View source code</p>
		</a>
	</body>
</html>
